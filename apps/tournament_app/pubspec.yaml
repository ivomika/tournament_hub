name: tournament_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  uuid: 4.6.0
  shared_preferences: 2.5.6
  go_router: 18.1.4
  qr: 4.0.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  widgetbook: ^3.25.0
  m3e_progress_indicator: 0.0.3

dev_dependencies:
  shared_preferences_platform_interface: 2.4.2
  go_router_builder: 4.5.3
  build_runner: 2.17.1
  zxing2: 0.2.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/roboto_condensed/RobotoCondensed-Variable.ttf
