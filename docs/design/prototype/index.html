<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TournamentHUB — первые экраны</title>
  <link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="components.css"><link rel="stylesheet" href="screens.css"><link rel="stylesheet" href="gallery.css">
</head>
<body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
  <symbol id="chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
  <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.01"/></symbol>
  <symbol id="contact" viewBox="0 0 24 24"><path d="M4 4h16v12H9l-5 4V4Z"/><path d="M8 8h8M8 12h5"/></symbol>
  <path id="boot-wave" d="M0 12 c2.667 -2.094 5.333 -4 8 -4 s5.333 1.906 8 4 s5.333 4 8 4 s5.333 -1.906 8 -4 c2.667 -2.094 5.333 -4 8 -4 s5.333 1.906 8 4 s5.333 4 8 4 s5.333 -1.906 8 -4 c2.667 -2.094 5.333 -4 8 -4 s5.333 1.906 8 4 s5.333 4 8 4 s5.333 -1.906 8 -4 c2.667 -2.094 5.333 -4 8 -4 s5.333 1.906 8 4 s5.333 4 8 4 s5.333 -1.906 8 -4 c2.667 -2.094 5.333 -4 8 -4 s5.333 1.906 8 4 s5.333 4 8 4 s5.333 -1.906 8 -4 c2.667 -2.094 5.333 -4 8 -4 s5.333 1.906 8 4 s5.333 4 8 4 s5.333 -1.906 8 -4"/>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
  <symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></symbol>
  <symbol id="history" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2.6 7M3 5v6h6m3-4v5l3 2"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="edit" viewBox="0 0 24 24"><path d="m15 4 5 5-11 11H4v-5L15 4Zm-3 3 5 5"/></symbol>
  <symbol id="alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4v.01"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="trophy" viewBox="0 0 24 24"><path d="M8 3h8v6a4 4 0 0 1-8 0V3ZM8 5H4v2a4 4 0 0 0 4 4m8-6h4v2a4 4 0 0 1-4 4m-4 2v6m-4 2h8m-6-2h4"/></symbol>
</defs></svg>
<main class="gallery">
  <header class="gallery-header"><h1>TournamentHUB <span class="muted">/ 01</span></h1><nav class="gallery-links" aria-label="Группы макетов"><a href="#bootstrap">Bootstrap</a><a href="#home">Главная</a><a href="#profile-refined">Профиль</a></nav></header>
  <section class="gallery-section" id="bootstrap" aria-labelledby="bootstrap-title">
    <div class="section-heading"><h2 id="bootstrap-title">01 / Bootstrap</h2><span>Инициализация приложения</span></div>
    <div class="variants">
      <figure id="boot-loading"><figcaption><b>А</b> Загрузка</figcaption><article class="phone bootstrap" aria-label="Bootstrap: загрузка">
        <div class="status" aria-hidden="true"><span>9:41</span><span class="status-right">5G <span class="battery"></span></span></div>
        <div class="screen-content"><div><div class="wordmark-line"></div><h2 class="bootstrap-logo">TOURNAMENT<span>HUB.</span></h2></div><div class="boot-state"><div class="boot-cue"><div class="boot-progress" role="progressbar" aria-label="Инициализация"><svg class="boot-track" viewBox="0 0 160 24" aria-hidden="true"><path d="M2 12H158"/></svg><div class="boot-wave-window"><svg viewBox="0 0 160 24" aria-hidden="true"><use class="boot-wave-phase" href="#boot-wave"/></svg></div></div></div><p>Подготавливаем<br>приложение…</p></div></div><div class="action-dock"></div><div class="home-indicator" aria-hidden="true"></div>
      </article></figure>
      <figure id="boot-error"><figcaption><b>Б</b> Ошибка</figcaption><article class="phone bootstrap" aria-label="Bootstrap: ошибка">
        <div class="status" aria-hidden="true"><span>9:41</span><span class="status-right">5G <span class="battery"></span></span></div>
        <div class="screen-content"><div><div class="wordmark-line"></div><h2 class="bootstrap-logo">TOURNAMENT<span>HUB.</span></h2></div><div class="boot-state boot-state--error" role="alert"><div class="boot-cue"><svg class="icon boot-error-symbol" aria-hidden="true"><use href="#alert"/></svg></div><h2>Не удалось запустить</h2></div></div><div class="action-dock"><a class="primary-action" href="#boot-retry">Повторить<svg class="icon" aria-hidden="true"><use href="#arrow"/></svg></a></div><div class="home-indicator" aria-hidden="true"></div>
      </article></figure>
      <figure id="boot-retry"><figcaption><b>В</b> Повторная попытка</figcaption><article class="phone bootstrap" aria-label="Bootstrap: повтор">
        <div class="status" aria-hidden="true"><span>9:41</span><span class="status-right">5G <span class="battery"></span></span></div>
        <div class="screen-content"><div><div class="wordmark-line"></div><h2 class="bootstrap-logo">TOURNAMENT<span>HUB.</span></h2></div><div class="boot-state"><div class="boot-cue"><div class="boot-progress" role="progressbar" aria-label="Повторная инициализация"><svg class="boot-track" viewBox="0 0 160 24" aria-hidden="true"><path d="M2 12H158"/></svg><div class="boot-wave-window"><svg viewBox="0 0 160 24" aria-hidden="true"><use class="boot-wave-phase" href="#boot-wave"/></svg></div></div></div><p>Подготавливаем<br>приложение…</p></div></div><div class="action-dock"><button class="primary-action" disabled>Пробуем снова…</button></div><div class="home-indicator" aria-hidden="true"></div>
      </article></figure>
    </div>
  </section>
  <section class="gallery-section" id="home" aria-labelledby="home-title">
    <div class="section-heading"><h2 id="home-title">02 / Главная</h2><span>Начать или продолжить</span></div>
    <div class="variants">
      <figure id="home-empty"><figcaption><b>А</b> Без активного турнира</figcaption><article class="phone home-empty home-type" aria-label="Главная: нет турнира"><div class="status" aria-hidden="true"><span>9:41</span><span class="status-right">5G <span class="battery"></span></span></div><div class="screen-content"><div class="top-controls"><button class="secondary-action" type="button"><svg class="icon" aria-hidden="true"><use href="#history"/></svg>История</button><a href="#profile-refined-view" class="orb" aria-label="Открыть профиль"><svg class="icon" aria-hidden="true"><use href="#person"/></svg></a></div>
        <div class="type-composition"><h2 class="type-title">Твой<br>следующий<br><span>турнир.</span></h2><div class="type-accent" aria-hidden="true"><span></span><svg class="icon"><use href="#trophy"/></svg><span></span></div><p class="subtle">Пока нет активного турнира</p></div><button class="primary-action" type="button">Создать турнир<svg class="icon" aria-hidden="true"><use href="#plus"/></svg></button></div><div class="action-dock"></div><div class="home-indicator" aria-hidden="true"></div></article></figure>
      <figure id="home-active"><figcaption><b>Б</b> Незавершённый турнир</figcaption><article class="phone home-active" aria-label="Главная: есть турнир">
        <div class="status" aria-hidden="true"><span>9:41</span><span class="status-right">5G <span class="battery"></span></span></div>
        <div class="screen-content"><div class="top-controls"><button class="secondary-action" type="button"><svg class="icon" aria-hidden="true"><use href="#history"/></svg>История</button><a href="#profile-refined-view" class="orb" aria-label="Открыть профиль"><svg class="icon" aria-hidden="true"><use href="#person"/></svg></a></div><div class="top-controls"><h2>Турниры</h2><button class="home-new-action" type="button"><svg class="icon" aria-hidden="true"><use href="#plus"/></svg>Новый</button></div><div class="active-tournament"><p class="eyebrow"><span class="live-dot" aria-hidden="true"></span>В процессе</p><h3>Пятничный турнир</h3><div class="tournament-meta"><span>Double Elimination</span><span>· 8 участников</span></div><div class="home-stage-visual" aria-hidden="true"><span></span><span class="current"></span><span></span><span></span></div><div class="tournament-stage"><span class="subtle">Верхняя сетка <span class="helper">· Раунд 2</span></span></div><button class="primary-action" type="button">Продолжить<svg class="icon" aria-hidden="true"><use href="#arrow"/></svg></button></div></div><div class="action-dock"></div><div class="home-indicator" aria-hidden="true"></div>
      </article></figure>
    </div>
  </section>
  <section class="gallery-section" id="profile-refined" aria-labelledby="profile-refined-title">
    <div class="section-heading"><h2 id="profile-refined-title">03 / Профиль</h2><span>Главное достижение и разделы профиля</span></div>
    <div class="variants">
      <figure id="profile-refined-view"><figcaption><b>А</b> Профиль</figcaption><article class="phone profile-current profile-current-view" aria-label="Профиль со статистикой"><div class="status" aria-hidden="true"><span>9:41</span><span class="status-right">5G <span class="battery"></span></span></div><div class="screen-content"><div class="top-controls"><a class="orb" href="#home" aria-label="На главную"><svg class="icon" aria-hidden="true"><use href="#back"/></svg></a><a class="orb" href="#profile-refined-edit" aria-label="Изменить имя"><svg class="icon" aria-hidden="true"><use href="#edit"/></svg></a></div><div class="profile-current-identity"><div class="profile-monogram" aria-hidden="true">И</div><div><h3>Иван</h3></div></div><section class="profile-stats-achievement" aria-label="Статистика"><div class="profile-achievement"><svg class="icon" aria-hidden="true"><use href="#trophy"/></svg><dl><div><dt>Победы в турнирах</dt><dd>3</dd></div></dl></div><dl class="profile-achievement-secondary"><div><dt>Турниры</dt><dd>12</dd></div><div><dt>Схватки</dt><dd>28</dd></div></dl></section><nav class="profile-menu" aria-label="Разделы профиля"><button class="profile-menu-item" type="button"><svg class="icon" aria-hidden="true"><use href="#settings"/></svg><span>Настройки</span><svg class="icon profile-menu-chevron" aria-hidden="true"><use href="#chevron"/></svg></button><button class="profile-menu-item" type="button"><svg class="icon" aria-hidden="true"><use href="#info"/></svg><span>О приложении</span><svg class="icon profile-menu-chevron" aria-hidden="true"><use href="#chevron"/></svg></button><button class="profile-menu-item" type="button"><svg class="icon" aria-hidden="true"><use href="#contact"/></svg><span>Связь</span><svg class="icon profile-menu-chevron" aria-hidden="true"><use href="#chevron"/></svg></button></nav></div><div class="action-dock"></div><div class="home-indicator" aria-hidden="true"></div></article></figure>
      <figure id="profile-refined-edit"><figcaption><b>Б</b> Изменение имени</figcaption><article class="phone profile-current" aria-label="Профиль: изменение имени"><div class="status" aria-hidden="true"><span>9:41</span><span class="status-right">5G <span class="battery"></span></span></div><div class="screen-content"><div class="top-controls"><a class="orb" href="#profile-refined-view" aria-label="Назад к профилю"><svg class="icon" aria-hidden="true"><use href="#back"/></svg></a><h2 class="profile-current-title">Редактирование</h2><button class="orb profile-save" type="button" aria-label="Сохранить имя" title="Сохранить имя"><svg class="icon" aria-hidden="true"><use href="#check"/></svg></button></div><div class="profile-form"><div class="field"><label for="current-edit-name">Имя</label><input id="current-edit-name" value="Иван М." readonly></div></div></div><div class="action-dock"></div><div class="home-indicator" aria-hidden="true"></div></article></figure>
      <figure id="profile-refined-error"><figcaption><b>В</b> Ошибка сохранения</figcaption><article class="phone profile-current" aria-label="Профиль: ошибка"><div class="status" aria-hidden="true"><span>9:41</span><span class="status-right">5G <span class="battery"></span></span></div><div class="screen-content"><div class="top-controls"><a class="orb" href="#profile-refined-view" aria-label="Назад к профилю"><svg class="icon" aria-hidden="true"><use href="#back"/></svg></a><h2 class="profile-current-title">Редактирование</h2><button class="orb profile-save" type="button" aria-label="Повторить сохранение" title="Повторить сохранение"><svg class="icon" aria-hidden="true"><use href="#check"/></svg></button></div><div class="profile-form"><div class="field"><label for="current-error-name">Имя</label><input id="current-error-name" value="Иван М." readonly aria-describedby="current-save-error"></div><p id="current-save-error" class="error-copy" role="alert"><svg class="icon" aria-hidden="true"><use href="#alert"/></svg><span>Не удалось сохранить</span></p></div></div><div class="action-dock"></div><div class="home-indicator" aria-hidden="true"></div></article></figure>
    </div>
  </section>
  <footer class="gallery-footer">Визуальные макеты · данные демонстрационные · действия не сохраняют изменения</footer>
</main>
</body>
</html>
